<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2b1a5e">
<meta name="description" content="Kumpulan game seru dan belajar untuk anak — Snake, Dino Run, Zombie, Tetris, Suika, Pahlawan Nusantara, dan lainnya.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dunia Kiya &amp; Zhian — Kumpulan Game Anak</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="home.css">
</head>
<body>

<div class="sky" id="sky" aria-hidden="true"></div>

<div class="wrap">

  <header>
    <button class="sound-btn" id="sound-btn" title="Hidup/matikan suara" aria-label="Hidup matikan suara">🔊</button>

    <h1 class="logo"><b>D</b><b>u</b><b>n</b><b>i</b><b>a</b> <span class="l2">Kiya &amp; Zhian</span></h1>
    <p class="tagline">Pilih game-nya, ayo main! 🎉</p>

    <div class="actions">
      <button class="big-btn" id="surprise">🎲 Kejutan!</button>
    </div>

    <nav class="filters" id="filters">
      <button class="chip on" data-f="semua">🌈 Semua <span class="n">10</span></button>
      <button class="chip" data-f="main">🎮 Game Seru <span class="n">7</span></button>
      <button class="chip" data-f="belajar">📚 Belajar TK <span class="n">3</span></button>
    </nav>
  </header>

  <section class="sect hide" id="recent">
    <div class="sect-head">
      <h2>🔥 Sering dimainkan</h2>
      <div class="line"></div>
    </div>
    <div class="grid" id="recent-grid"></div>
  </section>

  <section class="sect">
    <div class="sect-head">
      <h2>🎮 Pilih Game</h2>
      <div class="line"></div>
    </div>
    <div class="grid" id="grid"></div>

    <div class="empty hide" id="empty">
      <span class="em">🙈</span>
      Belum ada game di bagian ini.
    </div>
  </section>

  <footer>
    Dibuat untuk Kiya &amp; Zhian 💛
  </footer>

</div>

<noscript>
  <div class="wrap">
    <h2 style="margin:20px 0 10px">Daftar Game</h2>
    <ul style="line-height:2;padding-left:22px">
      <li><a href="pahlawan-nusantara/" style="color:#ffd166">Pahlawan Nusantara</a></li>
      <li><a href="snake-game/" style="color:#ffd166">Snake Arena</a></li>
      <li><a href="war-race/" style="color:#ffd166">Zombie Survival</a></li>
      <li><a href="dino-run/" style="color:#ffd166">Dino Run</a></li>
      <li><a href="tetris/" style="color:#ffd166">Neon Tetris</a></li>
      <li><a href="suika/" style="color:#ffd166">Suika Fruit</a></li>
      <li><a href="hole-io/" style="color:#ffd166">Hole.io</a></li>
      <li><a href="belajar-huruf/" style="color:#ffd166">Isi Huruf</a></li>
      <li><a href="belajar-angka/" style="color:#ffd166">Hitung Angka</a></li>
      <li><a href="belajar-warna/" style="color:#ffd166">Tebak Warna</a></li>
    </ul>
  </div>
</noscript>

<script src="home.js"></script>
</body>
</html>
