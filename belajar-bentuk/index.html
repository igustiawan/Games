<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tebak Bentuk — Belajar TK</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Nunito',system-ui,sans-serif;color:#fff;
  background:radial-gradient(circle at 50% -10%,#1f5a56,#14403c 40%,#08201e 100%);
  background-attachment:fixed;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:64px 16px 26px;overflow-x:hidden;
}
a.back{
  position:fixed;top:12px;left:12px;z-index:20;text-decoration:none;
  color:rgba(255,255,255,.8);font-weight:800;font-size:.82rem;
  background:rgba(0,0,0,.34);padding:9px 15px;border-radius:999px;
  border:1px solid rgba(255,255,255,.15);
}
a.back:hover{color:#fff;background:rgba(0,0,0,.5)}

h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(1.5rem,6vw,2.2rem);text-align:center}
.sub{color:rgba(255,255,255,.6);font-weight:700;font-size:.85rem;margin-top:4px;text-align:center}

.hud{width:100%;max-width:520px;margin:18px 0 6px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:16px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;border:2px solid rgba(255,255,255,.14)}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#7dffb0,#14b8a6);transition:width .35s}
.cnt{font-weight:900;font-size:.8rem;color:rgba(255,255,255,.75);white-space:nowrap}
.score{font-weight:900;font-size:.9rem;color:#ffd166;white-space:nowrap}

.stage{width:100%;max-width:520px;flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:10px}
.q{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(1.05rem,4.4vw,1.4rem);text-align:center;line-height:1.3}

.showcase{
  width:min(64vw,210px);aspect-ratio:1;display:grid;place-items:center;
  background:rgba(255,255,255,.07);border:3px solid rgba(255,255,255,.14);
  border-radius:28px;padding:24px;
}
.showcase .sh{width:100%;height:100%}
.nama{
  font-family:'Baloo 2',sans-serif;font-weight:800;
  font-size:clamp(1.7rem,8vw,2.6rem);color:#7dffb0;letter-spacing:.02em;text-align:center;
}
.hint{font-size:.8rem;font-weight:700;color:rgba(255,255,255,.55);text-align:center;min-height:1.2em}

.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%}
.opt{
  min-width:clamp(84px,24vw,112px);min-height:clamp(64px,18vw,82px);
  padding:10px 14px;
  background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.16);
  border-radius:20px;display:grid;place-items:center;cursor:pointer;
  font-family:'Baloo 2',sans-serif;font-weight:800;
  font-size:clamp(.9rem,3.4vw,1.05rem);color:#fff;
  transition:transform .14s,box-shadow .14s,background .14s;
}
.opt.sh_opt{width:clamp(84px,24vw,112px);height:clamp(84px,24vw,112px);padding:16px}
.opt.sh_opt .sh{width:100%;height:100%}
.opt:hover{background:rgba(255,255,255,.15);transform:translateY(-4px)}
.opt:active{transform:scale(.94)}
.opt.benar{border-color:#4ade80;background:rgba(74,222,128,.24);box-shadow:0 0 0 5px rgba(74,222,128,.16)}
.opt.salah{border-color:#f87171;background:rgba(248,113,113,.2);animation:shake .4s}
.opt.mati{pointer-events:none;opacity:.55}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.next{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.05rem;
  padding:14px 34px;border-radius:999px;border:none;cursor:pointer;color:#04231c;
  background:linear-gradient(180deg,#9dffc9,#3ddc97);border-bottom:5px solid #1a8a5c;
  display:none;margin-top:4px;
}
.next:active{transform:translateY(3px);border-bottom-width:2px}

.done{
  position:fixed;inset:0;display:none;place-items:center;z-index:30;
  background:rgba(3,18,16,.86);backdrop-filter:blur(7px);padding:20px;
}
.done.on{display:grid}
.card{
  background:linear-gradient(160deg,#1d4f4a,#0d2724);border:1px solid rgba(255,255,255,.16);
  border-radius:26px;padding:30px 26px;text-align:center;max-width:360px;width:100%;
  animation:pop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card .em{font-size:4rem;line-height:1}
.card h2{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.6rem;margin-top:8px}
.card .stars{font-size:2rem;letter-spacing:4px;margin:12px 0 6px}
.card p{color:rgba(255,255,255,.7);font-weight:700;font-size:.92rem;line-height:1.5}
.card .big{font-family:'Baloo 2',sans-serif;font-size:2.4rem;color:#ffd166;margin:8px 0}
.card button{
  margin-top:18px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.05rem;
  padding:14px 34px;border-radius:999px;border:none;cursor:pointer;color:#04231c;
  background:linear-gradient(180deg,#9dffc9,#3ddc97);border-bottom:5px solid #1a8a5c;width:100%;
}
.card button:active{transform:translateY(3px);border-bottom-width:2px}

.sh.circle{border-radius:50%}
.sh.square{border-radius:12%}
.sh.triangle{clip-path:polygon(50% 4%,97% 94%,3% 94%)}
.sh.diamond{clip-path:polygon(50% 2%,98% 50%,50% 98%,2% 50%)}
.sh.star{clip-path:polygon(50% 2%,61% 37%,98% 37%,68% 59%,79% 95%,50% 73%,21% 95%,32% 59%,2% 37%,39% 37%)}
.sh.heart{clip-path:polygon(50% 96%,10% 56%,4% 30%,20% 10%,38% 12%,50% 28%,62% 12%,80% 10%,96% 30%,90% 56%)}
.sh.oval{border-radius:50%;transform:scaleX(.68)}
.sh.trapezium{clip-path:polygon(24% 6%,76% 6%,100% 94%,0 94%)}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.05ms !important}}
</style>
</head>
<body>
<a class="back" href="../">← Dunia Kiya &amp; Zhian</a>

<h1>🔷 Tebak Bentuk</h1>
<p class="sub">Kenali bentuknya, lalu pilih jawabannya!</p>

<div class="hud">
  <div class="bar"><i id="fill"></i></div>
  <div class="cnt" id="cnt">Soal 1 / 10</div>
  <div class="score" id="score">⭐ 0</div>
</div>

<div class="stage">
  <div class="q" id="q">Bentuk apa ini?</div>
  <div id="show"></div>
  <div class="hint" id="hint"></div>
  <div class="opts" id="opts"></div>
  <button class="next" id="next">Lanjut →</button>
</div>

<div class="done" id="done">
  <div class="card">
    <div class="em" id="rEmoji">🎉</div>
    <h2 id="rTitle">Hebat!</h2>
    <div class="big" id="rScore">0 / 10</div>
    <div class="stars" id="rStars"></div>
    <p id="rMsg"></p>
    <button onclick="restart()">Main Lagi!</button>
  </div>
</div>

<script>
'use strict';
const TOTAL = 10;
const BENTUK = [
  { id:'circle',    nama:'LINGKARAN', warna:'#f87171', ciri:'Bulat penuh, tidak punya sudut.' },
  { id:'square',    nama:'PERSEGI',   warna:'#60a5fa', ciri:'Punya 4 sisi yang sama panjang.' },
  { id:'triangle',  nama:'SEGITIGA',  warna:'#facc15', ciri:'Punya 3 sisi dan 3 sudut.' },
  { id:'star',      nama:'BINTANG',   warna:'#fbbf24', ciri:'Ujungnya banyak dan runcing.' },
  { id:'heart',     nama:'HATI',      warna:'#f472b6', ciri:'Bentuknya seperti hati.' },
  { id:'oval',      nama:'LONJONG',   warna:'#34d399', ciri:'Bulat tapi memanjang.' },
  { id:'diamond',   nama:'BELAH KETUPAT', warna:'#a78bfa', ciri:'Seperti layangan, punya 4 sisi.' },
  { id:'trapezium', nama:'TRAPESIUM', warna:'#fb923c', ciri:'Punya 4 sisi, atasnya lebih pendek.' },
];

let soal = 0, benar = 0, kunci = null, terkunci = false, mode = 'tebak-bentuk';

const el = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
function acak(arr){ return arr.slice().sort(() => Math.random() - 0.5); }

function gambar(b){
  return '<div class="sh ' + b.id + '" style="background:' + b.warna + '"></div>';
}

function buatSoal(){
  terkunci = false;
  el('next').style.display = 'none';
  el('opts').innerHTML = '';
  el('show').innerHTML = '';

  const semua = acak(BENTUK);
  kunci = semua[0];
  const pengecoh = semua.slice(1, 3);

  // dua jenis soal: sebutkan namanya, atau cari gambarnya
  mode = Math.random() < 0.5 ? 'tebak-bentuk' : 'tebak-nama';

  if (mode === 'tebak-bentuk'){
    el('q').textContent = 'Bentuk apa ini?';
    el('hint').textContent = '';
    const box = document.createElement('div');
    box.className = 'showcase';
    box.innerHTML = gambar(kunci);
    el('show').appendChild(box);
    // pilihan berupa nama
    acak([kunci].concat(pengecoh)).forEach(b => {
      const o = document.createElement('div');
      o.className = 'opt';
      o.dataset.b = b.id;
      o.textContent = b.nama;
      o.onclick = () => jawab(o, b.id === kunci.id);
      el('opts').appendChild(o);
    });
  } else {
    el('q').innerHTML = 'Mana yang berbentuk <span style="color:#7dffb0">' + kunci.nama + '</span>?';
    el('hint').textContent = 'Petunjuk: ' + kunci.ciri;
    acak([kunci].concat(pengecoh)).forEach(b => {
      const o = document.createElement('div');
      o.className = 'opt sh_opt';
      o.dataset.b = b.id;
      o.innerHTML = gambar(b);
      o.onclick = () => jawab(o, b.id === kunci.id);
      el('opts').appendChild(o);
    });
  }

  el('cnt').textContent = 'Soal ' + (soal + 1) + ' / ' + TOTAL;
  el('fill').style.width = (soal / TOTAL * 100) + '%';
  el('score').textContent = '⭐ ' + benar;
}

function jawab(btn, tepat){
  if (terkunci) return;
  terkunci = true;
  if (tepat){
    benar++;
    btn.classList.add('benar');
    el('score').textContent = '⭐ ' + benar;
    el('hint').textContent = kunci.nama.charAt(0) + kunci.nama.slice(1).toLowerCase() + ' — ' + kunci.ciri;
    nada([660, 880]);
  } else {
    btn.classList.add('salah');
    document.querySelectorAll('#opts .opt').forEach(o => {
      if (o.dataset.b === kunci.id) o.classList.add('benar');
    });
    el('hint').textContent = 'Yang benar: ' + kunci.nama + ' — ' + kunci.ciri;
    nada([300, 240]);
  }
  document.querySelectorAll('#opts .opt').forEach(o => o.classList.add('mati'));
  setTimeout(() => el('next').style.display = 'block', tepat ? 420 : 1000);
}

el('next').onclick = () => {
  soal++;
  if (soal >= TOTAL) selesai();
  else buatSoal();
};

function selesai(){
  el('fill').style.width = '100%';
  const bintang = benar >= 9 ? 3 : benar >= 6 ? 2 : 1;
  el('rScore').textContent = benar + ' / ' + TOTAL;
  el('rStars').textContent = '⭐'.repeat(bintang) + '☆'.repeat(3 - bintang);
  if (bintang === 3){ el('rEmoji').textContent = '🏆'; el('rTitle').textContent = 'Sempurna!'; el('rMsg').textContent = 'Kamu hafal semua bentuk!'; }
  else if (bintang === 2){ el('rEmoji').textContent = '🎉'; el('rTitle').textContent = 'Hebat!'; el('rMsg').textContent = 'Sedikit lagi jadi sempurna!'; }
  else { el('rEmoji').textContent = '💪'; el('rTitle').textContent = 'Bagus!'; el('rMsg').textContent = 'Ayo ulang lagi supaya makin hafal!'; }
  el('done').classList.add('on');
  nada([523, 659, 784, 1047]);
}

function restart(){
  soal = 0; benar = 0;
  el('done').classList.remove('on');
  buatSoal();
}

let ac = null;
function nada(freqs){
  try{
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime;
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const t = t0 + i * 0.09;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.3);
    });
  }catch(e){}
}

buatSoal();
</script>
</body>
</html>
