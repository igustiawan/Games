<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Labirin Harta — Petualangan</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Nunito',system-ui,sans-serif;color:#fff;
  background:radial-gradient(circle at 50% 0%,#1c5c3a,#0f3a24 45%,#04160d 100%);
  background-attachment:fixed;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:56px 12px 16px;overflow:hidden;
}
a.back{
  position:fixed;top:12px;left:12px;z-index:20;text-decoration:none;
  color:rgba(255,255,255,.8);font-weight:800;font-size:.82rem;
  background:rgba(0,0,0,.34);padding:9px 15px;border-radius:999px;
  border:1px solid rgba(255,255,255,.15);
}
a.back:hover{color:#fff;background:rgba(0,0,0,.5)}

.hud{display:flex;gap:10px;width:min(94vw,430px);margin-bottom:10px}
.pill{
  flex:1;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.14);
  border-radius:14px;padding:7px 10px;text-align:center;
}
.pill .lab{font-size:.62rem;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,.5);text-transform:uppercase}
.pill .val{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.15rem;line-height:1.2;color:#ffd166}

.panggung{
  position:relative;width:min(94vw,430px);aspect-ratio:3/4;max-height:64vh;
  border-radius:22px;overflow:hidden;
  border:3px solid rgba(255,255,255,.14);
  box-shadow:0 22px 55px rgba(0,0,0,.55);
  touch-action:none;
}
canvas{display:block;width:100%;height:100%}

.pad{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  width:min(60vw,220px);margin-top:14px;
}
.pad button{
  aspect-ratio:1;border-radius:18px;border:none;cursor:pointer;color:#fff;
  background:rgba(255,255,255,.12);border-bottom:4px solid rgba(0,0,0,.3);
  font-size:1.5rem;line-height:1;display:grid;place-items:center;
}
.pad button:active{transform:translateY(3px);border-bottom-width:1px;background:rgba(255,255,255,.2)}
.pad .kosong{visibility:hidden}

.done{
  position:fixed;inset:0;display:none;place-items:center;z-index:30;
  background:rgba(3,16,10,.88);backdrop-filter:blur(7px);padding:20px;
}
.done.on{display:grid}
.card{
  background:linear-gradient(160deg,#1d5c3c,#0a2a1a);border:1px solid rgba(255,255,255,.16);
  border-radius:26px;padding:30px 26px;text-align:center;max-width:350px;width:100%;
  animation:pop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card .em{font-size:3.6rem;line-height:1}
.card h2{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.55rem;margin-top:6px}
.card p{color:rgba(255,255,255,.72);font-weight:700;font-size:.92rem;line-height:1.5;margin-top:10px}
.card .big{font-family:'Baloo 2',sans-serif;font-size:2.6rem;color:#ffd166;margin:6px 0 0}
.card button{
  margin-top:18px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.05rem;
  padding:14px 34px;border-radius:999px;border:none;cursor:pointer;color:#04231c;
  background:linear-gradient(180deg,#9dffc9,#3ddc97);border-bottom:5px solid #1a8a5c;width:100%;
}
.card button:active{transform:translateY(3px);border-bottom-width:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms !important}}
</style>
</head>
<body>
<a class="back" href="../">← Dunia Kiya &amp; Zhian</a>

<div class="hud">
  <div class="pill"><div class="lab">Level</div><div class="val" id="vLevel">1</div></div>
  <div class="pill"><div class="lab">Harta</div><div class="val" id="vHarta">0 / 4</div></div>
  <div class="pill"><div class="lab">Langkah</div><div class="val" id="vLangkah">0</div></div>
</div>

<div class="panggung" id="panggung"><canvas id="cv"></canvas></div>

<div class="pad">
  <button class="kosong"></button>
  <button data-arah="n">▲</button>
  <button class="kosong"></button>
  <button data-arah="w">◀</button>
  <button data-arah="s">▼</button>
  <button data-arah="e">▶</button>
</div>

<div class="done" id="done">
  <div class="card">
    <div class="em" id="rEmoji">🏆</div>
    <h2 id="rTitle">Harta Ditemukan!</h2>
    <div class="big" id="rBig">4</div>
    <p id="rMsg"></p>
    <button id="rBtn" onclick="lanjut()">Level Berikutnya →</button>
  </div>
</div>

<script>
'use strict';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const el = id => document.getElementById(id);

let VW = 400, VH = 533;
let st = null;

function ukuran(){
  const box = document.getElementById('panggung').getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  VW = Math.max(200, Math.round(box.width));
  VH = Math.max(260, Math.round(box.height));
  cv.width = Math.round(VW * dpr);
  cv.height = Math.round(VH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', () => { ukuran(); hitungTata(); });

/* ---------- pembuat labirin (backtracking) ---------- */
function buatLabirin(cols, rows){
  const c = [];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) c.push({ x, y, n: 1, e: 1, s: 1, w: 1, bobot: 0 });
  const at = (x, y) => (x < 0 || y < 0 || x >= cols || y >= rows) ? null : c[y * cols + x];
  const tumpuk = [at(0, 0)];
  at(0, 0).bobot = 1;
  while (tumpuk.length){
    const k = tumpuk[tumpuk.length - 1];
    const pilih = [];
    const n1 = at(k.x, k.y - 1), e1 = at(k.x + 1, k.y), s1 = at(k.x, k.y + 1), w1 = at(k.x - 1, k.y);
    if (n1 && !n1.bobot) pilih.push([n1, 'n', 's']);
    if (e1 && !e1.bobot) pilih.push([e1, 'e', 'w']);
    if (s1 && !s1.bobot) pilih.push([s1, 's', 'n']);
    if (w1 && !w1.bobot) pilih.push([w1, 'w', 'e']);
    if (!pilih.length){ tumpuk.pop(); continue; }
    const [nx, arah, lawan] = pilih[Math.floor(Math.random() * pilih.length)];
    k[arah] = 0; nx[lawan] = 0;
    nx.bobot = 1;
    tumpuk.push(nx);
  }
  return c;
}

let tata = { sel: 30, ox: 0, oy: 0 };

function hitungTata(){
  if (!st) return;
  const sel = Math.floor(Math.min(VW / st.cols, VH / st.rows));
  tata.sel = sel;
  tata.ox = (VW - sel * st.cols) / 2;
  tata.oy = (VH - sel * st.rows) / 2;
}

function mulaiLevel(n){
  const cols = Math.min(15, 7 + Math.floor((n - 1) / 2) * 2);
  const rows = Math.min(19, 9 + Math.floor((n - 1) / 2) * 2);
  st = {
    level: n, cols, rows,
    sel: buatLabirin(cols, rows),
    px: 0, py: 0,               // posisi piksel (untuk animasi)
    mx: 0, my: 0,               // sel sekarang
    tx: 0, ty: 0,               // sel tujuan
    gerak: 0,
    harta: [], ambil: 0,
    langkah: 0, selesai: false, t: 0,
  };
  // taruh harta di sel yang jauh dari awal
  const kandidat = st.sel.filter(c => (c.x + c.y) > Math.max(cols, rows) * 0.5);
  const n2 = Math.min(6, 3 + Math.floor(n / 2));
  const dipakai = new Set();
  for (let i = 0; i < n2 && kandidat.length; i++){
    const c = kandidat[Math.floor(Math.random() * kandidat.length)];
    const key = c.x + ',' + c.y;
    if (dipakai.has(key) || (c.x === 0 && c.y === 0)) continue;
    dipakai.add(key);
    st.harta.push({ x: c.x, y: c.y, ambil: false, fase: Math.random() * 6 });
  }
  st.px = 0; st.py = 0;
  hitungTata();
  el('vLevel').textContent = n;
  el('vHarta').textContent = '0 / ' + st.harta.length;
  el('vLangkah').textContent = '0';
  el('done').classList.remove('on');
}

function selDi(x, y){ return (x < 0 || y < 0 || x >= st.cols || y >= st.rows) ? null : st.sel[y * st.cols + x]; }

function coba(arah){
  if (!st || st.selesai || st.gerak > 0) return;
  const k = selDi(st.mx, st.my);
  if (k[arah] !== 0) return;                     // ada dinding
  const d = { n: [0, -1], e: [1, 0], s: [0, 1], w: [-1, 0] }[arah];
  st.tx = st.mx + d[0]; st.ty = st.my + d[1];
  st.gerak = 1;
  st.langkah++;
  el('vLangkah').textContent = st.langkah;
  bunyi(340 + Math.random() * 60, 0.05, 0.07);
}

function update(dt){
  if (!st) return;
  st.t += dt;
  if (st.gerak > 0){
    st.gerak = Math.max(0, st.gerak - dt * 7);
    if (st.gerak === 0){
      st.mx = st.tx; st.my = st.ty;
      // ambil harta?
      st.harta.forEach(h => {
        if (!h.ambil && h.x === st.mx && h.y === st.my){
          h.ambil = true; st.ambil++;
          el('vHarta').textContent = st.ambil + ' / ' + st.harta.length;
          bunyi(880, 0.16, 0.18);
        }
      });
      // sampai pintu keluar?
      if (st.mx === st.cols - 1 && st.my === st.rows - 1){
        if (st.ambil === st.harta.length) menang();
        else bunyi(300, 0.12, 0.12);
      }
    }
  }
  const k = 1 - st.gerak;
  const ax = st.mx + (st.tx - st.mx) * k;
  const ay = st.my + (st.ty - st.my) * k;
  st.px = tata.ox + (ax + 0.5) * tata.sel;
  st.py = tata.oy + (ay + 0.5) * tata.sel;
}

function menang(){
  st.selesai = true;
  nada([660, 880, 1100], 0.09, 0.2);
  el('rBig').textContent = st.level;
  el('rEmoji').textContent = '🏆';
  el('rTitle').textContent = 'Harta Ditemukan!';
  el('rMsg').textContent = 'Kamu jalan ' + st.langkah + ' langkah dan mengambil ' + st.harta.length + ' harta.';
  el('rBtn').textContent = 'Level ' + (st.level + 1) + ' →';
  setTimeout(() => el('done').classList.add('on'), 420);
}
function lanjut(){ mulaiLevel(st.level + 1); }

/* ---------- gambar ---------- */
function gambar(){
  if (!st) return;
  const s = tata.sel, ox = tata.ox, oy = tata.oy;

  // rumput
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#1f7a4c'); g.addColorStop(1, '#0d3f26');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  // lantai labirin
  ctx.fillStyle = 'rgba(0,0,0,.16)';
  for (const c of st.sel){
    ctx.fillRect(ox + c.x * s + 1, oy + c.y * s + 1, s - 2, s - 2);
  }

  // pintu keluar
  const gx = ox + (st.cols - 1) * s, gy = oy + (st.rows - 1) * s;
  const siap = st.ambil === st.harta.length;
  ctx.fillStyle = siap ? '#ffd166' : 'rgba(255,255,255,.18)';
  bulat(gx + s * .16, gy + s * .14, s * .34, s * .36, 6);
  ctx.fill();
  ctx.fillStyle = siap ? '#8a5a00' : 'rgba(255,255,255,.35)';
  ctx.font = `800 ${Math.round(s * .5)}px 'Baloo 2', Nunito, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🚪', gx + s / 2, gy + s / 2);

  // dinding
  ctx.strokeStyle = '#e9f5d0';
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(3, s * 0.13);
  ctx.beginPath();
  for (const c of st.sel){
    const x = ox + c.x * s, y = oy + c.y * s;
    if (c.n){ ctx.moveTo(x, y); ctx.lineTo(x + s, y); }
    if (c.w){ ctx.moveTo(x, y); ctx.lineTo(x, y + s); }
    if (c.s && c.y === st.rows - 1){ ctx.moveTo(x, y + s); ctx.lineTo(x + s, y + s); }
    if (c.e && c.x === st.cols - 1){ ctx.moveTo(x + s, y); ctx.lineTo(x + s, y + s); }
  }
  ctx.stroke();

  // harta
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  st.harta.forEach(h => {
    if (h.ambil) return;
    const x = ox + (h.x + .5) * s, y = oy + (h.y + .5) * s + Math.sin(st.t * 3 + h.fase) * s * .07;
    ctx.font = `${Math.round(s * .68)}px serif`;
    ctx.fillText('💎', x, y);
  });

  // pemain
  const px = st.px, py = st.py;
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(px, py + s * .30, s * .26, s * .11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4dabf7';
  ctx.beginPath(); ctx.arc(px, py, s * .33, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#123a63'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(px - s * .10, py - s * .06, s * .075, 0, Math.PI * 2);
  ctx.arc(px + s * .10, py - s * .06, s * .075, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#123a63';
  ctx.beginPath(); ctx.arc(px - s * .09, py - s * .05, s * .04, 0, Math.PI * 2);
  ctx.arc(px + s * .11, py - s * .05, s * .04, 0, Math.PI * 2); ctx.fill();
}

function bulat(x, y, rx, ry, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + rx, y, x + rx, y + ry, r);
  ctx.arcTo(x + rx, y + ry, x, y + ry, r);
  ctx.arcTo(x, y + ry, x, y, r);
  ctx.arcTo(x, y, x + rx, y, r);
  ctx.closePath();
}

/* ---------- kendali ---------- */
document.querySelectorAll('.pad button[data-arah]').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); coba(b.dataset.arah); });
});
window.addEventListener('keydown', e => {
  const m = { ArrowUp: 'n', ArrowDown: 's', ArrowLeft: 'w', ArrowRight: 'e', w: 'n', s: 's', a: 'w', d: 'e' };
  const a = m[e.key];
  if (a){ e.preventDefault(); coba(a); }
});

// geser jari
let sentuh0 = null;
const pang = document.getElementById('panggung');
pang.addEventListener('pointerdown', e => { sentuh0 = { x: e.clientX, y: e.clientY }; });
pang.addEventListener('pointerup', e => {
  if (!sentuh0) return;
  const dx = e.clientX - sentuh0.x, dy = e.clientY - sentuh0.y;
  sentuh0 = null;
  if (Math.hypot(dx, dy) < 18) return;
  if (Math.abs(dx) > Math.abs(dy)) coba(dx > 0 ? 'e' : 'w');
  else coba(dy > 0 ? 's' : 'n');
});

/* ---------- gelung ---------- */
let last = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000) || 0;
  last = now;
  update(dt);
  gambar();
}

/* ---------- suara ---------- */
let ac = null;
function bunyi(f, vol, dur){
  try{
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.18));
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + (dur || 0.18) + 0.02);
  }catch(e){}
}
function nada(freqs, jeda, vol){
  try{
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime;
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const t = t0 + i * (jeda || 0.09);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.26);
    });
  }catch(e){}
}

ukuran();
mulaiLevel(1);
requestAnimationFrame(loop);
</script>
</body>
</html>
