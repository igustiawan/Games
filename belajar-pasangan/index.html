<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cari Pasangan — Belajar TK</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Nunito',system-ui,sans-serif;color:#fff;
  background:radial-gradient(circle at 50% -10%,#6b2a6a,#3d1440 42%,#180718 100%);
  background-attachment:fixed;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:64px 16px 26px;overflow-x:hidden;
}
a.back{
  position:fixed;top:12px;left:12px;z-index:20;text-decoration:none;
  color:rgba(255,255,255,.8);font-weight:800;font-size:.82rem;
  background:rgba(0,0,0,.34);padding:9px 15px;border-radius:999px;
  border:1px solid rgba(255,255,255,.15);
}
a.back:hover{color:#fff;background:rgba(0,0,0,.5)}

h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(1.5rem,6vw,2.2rem);text-align:center}
.sub{color:rgba(255,255,255,.6);font-weight:700;font-size:.85rem;margin-top:4px;text-align:center}

.hud{
  width:100%;max-width:470px;margin:18px 0 12px;
  display:flex;justify-content:space-between;gap:10px;
}
.pill{
  flex:1;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.14);
  border-radius:16px;padding:9px 12px;text-align:center;
}
.pill .lab{font-size:.66rem;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,.5);text-transform:uppercase}
.pill .val{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.25rem;line-height:1.2}
.pill.gold .val{color:#ffd166}

.board{
  display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(7px,2.4vw,12px);
  width:100%;max-width:470px;
  perspective:900px;
}
.card{
  aspect-ratio:1;position:relative;cursor:pointer;
  transform-style:preserve-3d;transition:transform .42s cubic-bezier(.4,.8,.4,1);
}
.card.flip{transform:rotateY(180deg)}
.card.benar{animation:benar .45s ease}
@keyframes benar{0%,100%{transform:rotateY(180deg) scale(1)}45%{transform:rotateY(180deg) scale(1.13)}}
.face{
  position:absolute;inset:0;border-radius:16px;
  display:grid;place-items:center;backface-visibility:hidden;
  border:3px solid rgba(255,255,255,.16);
  font-size:clamp(1.6rem,7vw,2.3rem);
}
.face.belakang{
  background:linear-gradient(150deg,#8b3fa0,#4a1d5c);
  color:rgba(255,255,255,.5);font-family:'Baloo 2',sans-serif;font-weight:800;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);
}
.face.belakang::after{content:'?';font-size:clamp(1.3rem,5.5vw,1.9rem)}
.face.depan{
  transform:rotateY(180deg);
  background:linear-gradient(150deg,#fff4e0,#ffd9a8);
}
.card.benar .face.depan{background:linear-gradient(150deg,#d6ffe8,#8ff0c0);border-color:#4ade80}

.done{
  position:fixed;inset:0;display:none;place-items:center;z-index:30;
  background:rgba(16,3,18,.86);backdrop-filter:blur(7px);padding:20px;
}
.done.on{display:grid}
.card-res{
  background:linear-gradient(160deg,#582a63,#2b0f33);border:1px solid rgba(255,255,255,.16);
  border-radius:26px;padding:30px 26px;text-align:center;max-width:360px;width:100%;
  animation:pop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card-res .em{font-size:4rem;line-height:1}
.card-res h2{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.6rem;margin-top:8px}
.card-res .stars{font-size:2rem;letter-spacing:4px;margin:12px 0 6px}
.card-res .big{font-family:'Baloo 2',sans-serif;font-size:2.2rem;color:#ffd166;margin:6px 0}
.card-res p{color:rgba(255,255,255,.7);font-weight:700;font-size:.92rem;line-height:1.5}
.card-res button{
  margin-top:18px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.05rem;
  padding:14px 34px;border-radius:999px;border:none;cursor:pointer;color:#3a2405;
  background:linear-gradient(180deg,#ffe08a,#ffc23c);border-bottom:5px solid #b8801a;width:100%;
}
.card-res button:active{transform:translateY(3px);border-bottom-width:2px}

.burst{position:fixed;pointer-events:none;z-index:25;font-size:1.6rem;animation:terbang .8s ease-out forwards}
@keyframes terbang{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.08s !important}}
</style>
</head>
<body>
<a class="back" href="../">← Dunia Kiya &amp; Zhian</a>

<h1>🃏 Cari Pasangan</h1>
<p class="sub">Buka dua kartu, cari gambar yang sama!</p>

<div class="hud">
  <div class="pill"><div class="lab">Pasangan</div><div class="val" id="vPasang">0 / 8</div></div>
  <div class="pill"><div class="lab">Langkah</div><div class="val" id="vLangkah">0</div></div>
  <div class="pill gold"><div class="lab">Waktu</div><div class="val" id="vWaktu">0:00</div></div>
</div>

<div class="board" id="board"></div>

<div class="done" id="done">
  <div class="card-res">
    <div class="em" id="rEmoji">🎉</div>
    <h2 id="rTitle">Hebat!</h2>
    <div class="stars" id="rStars"></div>
    <div class="big" id="rBig"></div>
    <p id="rMsg"></p>
    <button onclick="restart()">Main Lagi!</button>
  </div>
</div>

<script>
'use strict';
const GAMBAR = ['🐶','🐱','🐰','🦁','🐸','🐼','🦋','🐝'];
let deck = [], terbuka = [], pasang = 0, langkah = 0, kunci = false, mulai = 0, timer = null, jalan = false;

const el = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
function acak(a){ return a.slice().sort(() => Math.random() - 0.5); }

function buat(){
  // 8 pasang = 16 kartu
  deck = acak(GAMBAR.concat(GAMBAR));
  terbuka = []; pasang = 0; langkah = 0; kunci = false; jalan = false;
  el('vPasang').textContent = '0 / 8';
  el('vLangkah').textContent = '0';
  el('vWaktu').textContent = '0:00';
  el('done').classList.remove('on');
  if (timer) clearInterval(timer);

  const board = el('board');
  board.innerHTML = '';
  deck.forEach((emoji, i) => {
    const c = document.createElement('div');
    c.className = 'card';
    c.dataset.emoji = emoji;
    c.dataset.i = i;
    c.innerHTML =
      '<div class="face belakang"></div>' +
      '<div class="face depan">' + emoji + '</div>';
    c.onclick = () => buka(c);
    c.style.animation = 'pop .34s cubic-bezier(.34,1.56,.64,1) ' + (i * 0.03) + 's backwards';
    board.appendChild(c);
  });
}

function mulaiJam(){
  if (jalan) return;
  jalan = true;
  mulai = Date.now();
  timer = setInterval(() => {
    const s = Math.floor((Date.now() - mulai) / 1000);
    el('vWaktu').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }, 250);
}

function buka(card){
  if (kunci || card.classList.contains('flip')) return;
  mulaiJam();
  card.classList.add('flip');
  terbuka.push(card);
  if (terbuka.length < 2) return;

  langkah++;
  el('vLangkah').textContent = langkah;
  const [a, b] = terbuka;

  if (a.dataset.emoji === b.dataset.emoji){
    // cocok
    pasang++;
    el('vPasang').textContent = pasang + ' / 8';
    a.classList.add('benar'); b.classList.add('benar');
    terbuka = [];
    nada([760, 1010], 0.09);
    letakBintang(a);
    if (pasang === 8) setTimeout(selesai, 620);
  } else {
    // tidak cocok
    kunci = true;
    nada([320, 250], 0.1);
    setTimeout(() => {
      a.classList.remove('flip'); b.classList.remove('flip');
      terbuka = []; kunci = false;
    }, 850);
  }
}

function letakBintang(card){
  const r = card.getBoundingClientRect();
  for (let i = 0; i < 5; i++){
    const s = document.createElement('div');
    s.className = 'burst';
    s.textContent = ['⭐','✨','💫'][i % 3];
    s.style.left = (r.left + r.width / 2) + 'px';
    s.style.top = (r.top + r.height / 2) + 'px';
    s.style.setProperty('--dx', (rnd(160) - 80) + 'px');
    s.style.setProperty('--dy', (-40 - rnd(90)) + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 850);
  }
}

function selesai(){
  if (timer) clearInterval(timer);
  const detik = Math.floor((Date.now() - mulai) / 1000);
  const menit = Math.floor(detik / 60) + ':' + String(detik % 60).padStart(2, '0');
  // makin sedikit langkah, makin banyak bintang
  const bintang = langkah <= 14 ? 3 : langkah <= 22 ? 2 : 1;
  el('rStars').textContent = '⭐'.repeat(bintang) + '☆'.repeat(3 - bintang);
  el('rBig').textContent = langkah + ' langkah · ' + menit;
  if (bintang === 3){ el('rEmoji').textContent = '🏆'; el('rTitle').textContent = 'Ingatan Hebat!'; el('rMsg').textContent = 'Kamu menemukan semua pasangan dengan sangat cepat!'; }
  else if (bintang === 2){ el('rEmoji').textContent = '🎉'; el('rTitle').textContent = 'Hebat!'; el('rMsg').textContent = 'Semua pasangan ketemu! Coba lebih cepat lagi ya.'; }
  else { el('rEmoji').textContent = '👏'; el('rTitle').textContent = 'Selesai!'; el('rMsg').textContent = 'Bagus! Main lagi supaya makin hafal.'; }
  el('done').classList.add('on');
  nada([523, 659, 784, 1047], 0.11);
}

function restart(){ buat(); }

let ac = null;
function nada(freqs, jeda){
  try{
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime;
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const t = t0 + i * (jeda || 0.09);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.28);
    });
  }catch(e){}
}

buat();
</script>
</body>
</html>
