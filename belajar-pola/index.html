<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pola Warna — Belajar TK</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Nunito',system-ui,sans-serif;color:#fff;
  background:radial-gradient(circle at 50% -10%,#4a2a86,#2b1a5e 40%,#150b30 100%);
  background-attachment:fixed;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:64px 16px 26px;overflow-x:hidden;
}
a.back{
  position:fixed;top:12px;left:12px;z-index:20;text-decoration:none;
  color:rgba(255,255,255,.8);font-weight:800;font-size:.82rem;
  background:rgba(0,0,0,.34);padding:9px 15px;border-radius:999px;
  border:1px solid rgba(255,255,255,.15);
}
a.back:hover{color:#fff;background:rgba(0,0,0,.5)}

h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(1.5rem,6vw,2.2rem);text-align:center}
.sub{color:rgba(255,255,255,.6);font-weight:700;font-size:.85rem;margin-top:4px;text-align:center}

.hud{width:100%;max-width:520px;margin:18px 0 6px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:16px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;border:2px solid rgba(255,255,255,.14)}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ffd166,#ff9a3c);transition:width .35s}
.cnt{font-weight:900;font-size:.8rem;color:rgba(255,255,255,.75);white-space:nowrap}
.score{font-weight:900;font-size:.9rem;color:#ffd166;white-space:nowrap}

.stage{width:100%;max-width:520px;flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:10px}
.q{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(1.05rem,4.4vw,1.4rem);text-align:center;line-height:1.3}

.row{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);
  border-radius:22px;padding:16px 14px;min-height:92px;
}
.slot{width:clamp(38px,10vw,52px);height:clamp(38px,10vw,52px);position:relative;display:grid;place-items:center}
.slot .sh{width:100%;height:100%}
.slot.q{
  background:rgba(255,255,255,.14);border-radius:14px;
  font-family:'Baloo 2',sans-serif;font-size:clamp(1.2rem,4vw,1.6rem);
  color:#ffd166;font-weight:800;
  animation:denyut 1.4s ease-in-out infinite;
}
@keyframes denyut{0%,100%{transform:scale(1)}50%{transform:scale(1.10)}}

.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%}
.opt{
  width:clamp(78px,22vw,104px);height:clamp(78px,22vw,104px);
  background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.16);
  border-radius:22px;display:grid;place-items:center;cursor:pointer;
  transition:transform .14s,box-shadow .14s,background .14s;
}
.opt .sh{width:62%;height:62%}
.opt:hover{background:rgba(255,255,255,.15);transform:translateY(-4px)}
.opt:active{transform:scale(.94)}
.opt.benar{border-color:#4ade80;background:rgba(74,222,128,.22);box-shadow:0 0 0 5px rgba(74,222,128,.16)}
.opt.salah{border-color:#f87171;background:rgba(248,113,113,.2);animation:shake .4s}
.opt.mati{pointer-events:none;opacity:.55}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.next{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.05rem;
  padding:14px 34px;border-radius:999px;border:none;cursor:pointer;color:#3a2405;
  background:linear-gradient(180deg,#ffe08a,#ffc23c);border-bottom:5px solid #b8801a;
  display:none;margin-top:4px;
}
.next:active{transform:translateY(3px);border-bottom-width:2px}

.done{
  position:fixed;inset:0;display:none;place-items:center;z-index:30;
  background:rgba(8,4,20,.85);backdrop-filter:blur(7px);padding:20px;
}
.done.on{display:grid}
.card{
  background:linear-gradient(160deg,#33206a,#1d1140);border:1px solid rgba(255,255,255,.16);
  border-radius:26px;padding:30px 26px;text-align:center;max-width:360px;width:100%;
  animation:pop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card .em{font-size:4rem;line-height:1}
.card h2{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.6rem;margin-top:8px}
.card .stars{font-size:2rem;letter-spacing:4px;margin:12px 0 6px}
.card p{color:rgba(255,255,255,.7);font-weight:700;font-size:.92rem;line-height:1.5}
.card .big{font-family:'Baloo 2',sans-serif;font-size:2.4rem;color:#ffd166;margin:8px 0}
.card button{
  margin-top:18px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.05rem;
  padding:14px 34px;border-radius:999px;border:none;cursor:pointer;color:#3a2405;
  background:linear-gradient(180deg,#ffe08a,#ffc23c);border-bottom:5px solid #b8801a;width:100%;
}
.card button:active{transform:translateY(3px);border-bottom-width:2px}

/* bentuk lewat clip-path */
.sh.circle{border-radius:50%}
.sh.square{border-radius:14%}
.sh.triangle{clip-path:polygon(50% 6%,96% 92%,4% 92%)}
.sh.diamond{clip-path:polygon(50% 2%,98% 50%,50% 98%,2% 50%)}
.sh.star{clip-path:polygon(50% 2%,61% 37%,98% 37%,68% 59%,79% 95%,50% 73%,21% 95%,32% 59%,2% 37%,39% 37%)}
.sh.heart{clip-path:polygon(50% 96%,10% 56%,4% 30%,20% 10%,38% 12%,50% 28%,62% 12%,80% 10%,96% 30%,90% 56%)}
.sh.oval{border-radius:50%;transform:scaleX(.72)}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.05ms !important}}
</style>
</head>
<body>
<a class="back" href="../">← Dunia Kiya &amp; Zhian</a>

<h1>🌈 Pola Warna</h1>
<p class="sub">Lihat polanya, pilih gambar yang tepat di ujung!</p>

<div class="hud">
  <div class="bar"><i id="fill"></i></div>
  <div class="cnt" id="cnt">Soal 1 / 10</div>
  <div class="score" id="score">⭐ 0</div>
</div>

<div class="stage">
  <div class="q" id="q">Apa lanjutan polanya?</div>
  <div class="row" id="row"></div>
  <div class="opts" id="opts"></div>
  <button class="next" id="next">Lanjut →</button>
</div>

<div class="done" id="done">
  <div class="card">
    <div class="em" id="rEmoji">🎉</div>
    <h2 id="rTitle">Hebat!</h2>
    <div class="big" id="rScore">0 / 10</div>
    <div class="stars" id="rStars"></div>
    <p id="rMsg"></p>
    <button onclick="restart()">Main Lagi!</button>
  </div>
</div>

<script>
'use strict';
const TOTAL = 10;
const COLORS = [
  { n:'merah',  c:'#ef4444' }, { n:'biru',   c:'#3b82f6' },
  { n:'kuning', c:'#facc15' }, { n:'hijau',  c:'#22c55e' },
  { n:'oranye', c:'#f97316' }, { n:'ungu',   c:'#a855f7' },
  { n:'pink',   c:'#ec4899' }, { n:'tosca',  c:'#14b8a6' },
];
const SHAPES = ['circle','square','triangle','star','diamond','heart'];

/* susunan pola: makin lama makin rumit */
const POLA = [
  [2, 2], [2, 2], [2, 2],          // AB AB AB
  [2, 3], [2, 3], [2, 3],          // AAB
  [3, 2], [3, 2],                  // ABC
  [4, 2], [4, 2],                  // ABCD
];

let soal = 0, benar = 0, jawaban = null, terkunci = false;

const el = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const pilih = arr => arr[rnd(arr.length)];

function bentuk(shape, color, size){
  return '<div class="sh ' + shape + '" style="background:' + color + ';width:100%;height:100%"></div>';
}

function buatSoal(){
  terkunci = false;
  el('next').style.display = 'none';
  el('opts').innerHTML = '';

  const [jmlWarna, panjang] = POLA[soal];
  // pilih warna & bentuk berbeda untuk tiap posisi dalam pola
  const pool = COLORS.slice().sort(() => Math.random() - 0.5).slice(0, jmlWarna);
  const bentukPool = SHAPES.slice().sort(() => Math.random() - 0.5).slice(0, jmlWarna);
  const dasar = [];
  for (let i = 0; i < jmlWarna; i++) dasar.push({ col: pool[i], sh: bentukPool[i] });

  // bangun deret: pola diulang sampai melewati jumlah yang ditampilkan
  const tampil = jmlWarna * panjang + 2;
  const deret = [];
  for (let i = 0; i < tampil; i++) deret.push(dasar[i % jmlWarna]);
  jawaban = deret[tampil - 1];

  // gambar deret, sisakan yang terakhir sebagai tanda tanya
  const row = el('row');
  row.innerHTML = '';
  deret.forEach((d, i) => {
    const s = document.createElement('div');
    const last = i === tampil - 1;
    s.className = 'slot' + (last ? ' q' : '');
    if (last) s.textContent = '?';
    else s.innerHTML = bentuk(d.sh, d.col.c);
    s.style.animation = 'pop .3s cubic-bezier(.34,1.56,.64,1) ' + (i * 0.04) + 's backwards';
    row.appendChild(s);
  });

  // pilihan jawaban: 1 benar + 2 pengecoh
  const salah = COLORS.filter(c => c.c !== jawaban.col.c).sort(() => Math.random() - 0.5).slice(0, 2);
  const opsi = [jawaban].concat(salah.map(c => ({ col: c, sh: jawaban.sh })))
    .sort(() => Math.random() - 0.5);

  opsi.forEach(o => {
    const b = document.createElement('div');
    b.className = 'opt';
    b.dataset.col = o.col.c;
    b.innerHTML = bentuk(o.sh, o.col.c);
    b.onclick = () => pilihJawaban(b, o.col.c === jawaban.col.c);
    el('opts').appendChild(b);
  });

  el('q').textContent = 'Apa lanjutan polanya?';
  el('cnt').textContent = 'Soal ' + (soal + 1) + ' / ' + TOTAL;
  el('fill').style.width = (soal / TOTAL * 100) + '%';
  el('score').textContent = '⭐ ' + benar;
}

function pilihJawaban(btn, tepat){
  if (terkunci) return;
  terkunci = true;
  if (tepat){
    benar++;
    btn.classList.add('benar');
    el('score').textContent = '⭐ ' + benar;
    suara('benar');
    el('done').classList.remove('on');
    setTimeout(() => el('next').style.display = 'block', 260);
  } else {
    btn.classList.add('salah');
    // tunjukkan jawaban yang benar
    document.querySelectorAll('#opts .opt').forEach(o => {
      if (o.dataset.col === jawaban.col.c) o.classList.add('benar');
    });
    suara('salah');
    setTimeout(() => el('next').style.display = 'block', 700);
  }
  document.querySelectorAll('#opts .opt').forEach(o => o.classList.add('mati'));
}

el('next').onclick = () => {
  soal++;
  if (soal >= TOTAL) selesai();
  else buatSoal();
};

function selesai(){
  el('fill').style.width = '100%';
  const bintang = benar >= 9 ? 3 : benar >= 6 ? 2 : 1;
  el('rScore').textContent = benar + ' / ' + TOTAL;
  el('rStars').textContent = '⭐'.repeat(bintang) + '☆'.repeat(3 - bintang);
  if (bintang === 3){ el('rEmoji').textContent = '🏆'; el('rTitle').textContent = 'Sempurna!'; el('rMsg').textContent = 'Kamu jago sekali melihat pola!'; }
  else if (bintang === 2){ el('rEmoji').textContent = '🎉'; el('rTitle').textContent = 'Hebat!'; el('rMsg').textContent = 'Sedikit lagi jadi sempurna!'; }
  else { el('rEmoji').textContent = '💪'; el('rTitle').textContent = 'Bagus!'; el('rMsg').textContent = 'Ayo coba lagi, pasti bisa lebih baik!'; }
  el('done').classList.add('on');
  suara('selesai');
}

function restart(){
  soal = 0; benar = 0;
  el('done').classList.remove('on');
  buatSoal();
}

/* --- suara sederhana --- */
let ac = null;
function suara(jenis){
  try{
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime;
    const nada = jenis === 'benar' ? [660, 880] : jenis === 'salah' ? [300, 240] : [523, 659, 784, 1047];
    nada.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      const t = t0 + i * 0.09;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.3);
    });
  }catch(e){}
}

buatSoal();
</script>
</body>
</html>
